<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Video - Caldo de Cana Cardoso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #000000 0%, #2c2c2c 50%, #404040 100%);
            font-family: 'Arial', sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(45deg, #000000, #1a1a1a, #2d2d2d, #1a1a1a, #000000);
            background-size: 400% 400%;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .floating-element {
            position: absolute;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(5deg); opacity: 0.6; }
        }

        .pizza-slice {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation: float 8s ease-in-out infinite, spin 20s linear infinite;
        }

        .hamburger {
            width: 50px;
            height: 30px;
            background: linear-gradient(to bottom, #8B4513 0%, #A0522D 50%, #8B4513 100%);
            border-radius: 50px;
            position: relative;
            animation: float 7s ease-in-out infinite;
        }

        .hamburger::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 5px;
            right: 5px;
            height: 15px;
            background: linear-gradient(to bottom, #F4A460, #D2691E);
            border-radius: 50px 50px 0 0;
        }

        .hamburger::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 8px;
            right: 8px;
            height: 4px;
            background: #228B22;
            border-radius: 2px;
        }

        .french-fries {
            width: 8px;
            height: 40px;
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            border-radius: 4px 4px 0 0;
            animation: float 9s ease-in-out infinite;
            position: relative;
        }

        .french-fries::before,
        .french-fries::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 35px;
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            border-radius: 4px 4px 0 0;
        }

        .french-fries::before {
            left: 12px;
            height: 38px;
        }

        .french-fries::after {
            left: 24px;
            height: 42px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: bubble 10s linear infinite;
        }

        @keyframes bubble {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: particle 15s linear infinite;
        }

        @keyframes particle {
            0% {
                transform: translateX(0) translateY(100vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(200px) translateY(-100px);
                opacity: 0;
            }
        }

        .glow-orb {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, rgba(255, 215, 0, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: glow 12s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                transform: scale(1) translateX(0) translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.5) translateX(50px) translateY(-30px);
                opacity: 0.6;
            }
        }

        .steam {
            position: absolute;
            width: 3px;
            height: 30px;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            animation: steam 4s ease-in-out infinite;
        }

        @keyframes steam {
            0% {
                transform: translateY(0) scaleY(1);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-50px) scaleY(1.5);
                opacity: 0;
            }
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }

        .logo-text {
            font-size: 3rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 1rem;
            animation: pulse 3s ease-in-out infinite;
        }

        .logo-subtitle {
            font-size: 1.2rem;
            color: #FFA500;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.8);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Logo Central -->
        <div class="center-logo">
            <div class="logo-text">CALDO DE CANA</div>
            <div class="logo-subtitle">CARDOSO</div>
        </div>

        <!-- Elementos Flutuantes de Comida -->
        <div class="floating-element pizza-slice" style="top: 15%; left: 10%; animation-delay: 0s;"></div>
        <div class="floating-element hamburger" style="top: 25%; right: 15%; animation-delay: 2s;"></div>
        <div class="floating-element french-fries" style="top: 60%; left: 20%; animation-delay: 1s;"></div>
        <div class="floating-element pizza-slice" style="bottom: 20%; right: 25%; animation-delay: 3s;"></div>
        <div class="floating-element hamburger" style="bottom: 35%; left: 8%; animation-delay: 4s;"></div>

        <!-- Orbes de Luz -->
        <div class="glow-orb" style="top: 10%; left: 5%; animation-delay: 0s;"></div>
        <div class="glow-orb" style="top: 70%; right: 10%; animation-delay: 6s;"></div>
        <div class="glow-orb" style="top: 40%; left: 80%; animation-delay: 3s;"></div>

        <!-- Vapor/Steam -->
        <div class="steam" style="top: 30%; left: 15%; animation-delay: 0s;"></div>
        <div class="steam" style="top: 50%; right: 20%; animation-delay: 2s;"></div>
        <div class="steam" style="top: 70%; left: 60%; animation-delay: 4s;"></div>
        <div class="steam" style="top: 20%; right: 40%; animation-delay: 1s;"></div>
    </div>

    <script>
        // Criar partículas dinâmicas
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            document.querySelector('.video-container').appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 25000);
        }

        // Criar bolhas
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.width = bubble.style.height = (Math.random() * 60 + 20) + 'px';
            bubble.style.animationDelay = Math.random() * 10 + 's';
            document.querySelector('.video-container').appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 12000);
        }

        // Gerar partículas e bolhas continuamente
        setInterval(createParticle, 2000);
        setInterval(createBubble, 3000);

        // Criar algumas partículas e bolhas iniciais
        for (let i = 0; i < 5; i++) {
            setTimeout(createParticle, i * 1000);
            setTimeout(createBubble, i * 1500);
        }
    </script>
</body>
</html>
